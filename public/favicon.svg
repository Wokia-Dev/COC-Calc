<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.8"/>

  <!-- Outer Ring (Clock Face) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="20" opacity="0.6"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#gold)" stroke-width="20" stroke-dasharray="1005" stroke-dashoffset="320" stroke-linecap="round"/>

  <!-- Clock tick marks -->
  <line x1="256" y1="120" x2="256" y2="140" stroke="#fbbf24" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="372" x2="256" y2="392" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="120" y1="256" x2="140" y2="256" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <line x1="372" y1="256" x2="392" y2="256" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

  <!-- Central Hammer & Lightning Icon -->
  <g filter="url(#shadow)">
    <!-- Crossed builder hammer -->
    <path d="M190 322 L290 222" stroke="#64748b" stroke-width="24" stroke-linecap="round"/>
    <rect x="260" y="180" width="70" height="40" rx="8" transform="rotate(45 295 200)" fill="url(#gold)"/>
    
    <!-- Lightning Bolt overlay -->
    <path d="M266 140 L196 260 L246 260 L236 362 L316 236 L266 236 Z" fill="url(#glow)"/>
  </g>

  <!-- Center hub -->
  <circle cx="256" cy="256" r="12" fill="#f8fafc" stroke="#0f172a" stroke-width="4"/>
</svg>
